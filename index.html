<!-- ================= JAVASCRIPT ================= -->
  <script>
    // BẠN CẦN THAY THẾ CHUỖI NÀY BẰNG URL WEB APP CỦA GOOGLE APPS SCRIPT
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyqW1TKhFbLpse1GdEXoN2kI-9lEvSq85UNmuexfiJ85NLQb-kxYU7Jl7JoCpWU_aAb2w/exec";

    let allMenuItems = [];
    let cart = {};
    let currentCategory = 'ALL';
    let currentUser = JSON.parse(localStorage.getItem('canteen_user_client')) || null;
    let localSavedOrderIds = JSON.parse(localStorage.getItem('canteen_my_orders')) || [];
    let currentTab = 'menu';

    // Hàm gọi API giao tiếp với GAS Backend
    async function callGAS(action, ...args) {
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8", // text/plain giúp tránh lỗi CORS Preflight
          },
          body: JSON.stringify({ action: action, args: args })
        });
        const result = await response.json();
        return result;
      } catch (error) {
        console.error("API Error:", error);
        throw new Error("Lỗi kết nối đến máy chủ");
      }
    }

    // KHỞI CHẠY HỆ THỐNG
    window.addEventListener('DOMContentLoaded', () => {
      loadInitialData();
      renderUserProfileUI();

      setInterval(() => {
        loadCustomerOrders(false, true);
      }, 30000); 
    });

    // 1. TẢI DỮ LIỆU MENU BAN ĐẦU
    function loadInitialData() {
      callGAS('getClientInitialData')
        .then(res => {
          if (res.success) {
            document.getElementById('topCanteenName').innerText = res.canteenName;
            document.getElementById('topCanteenSubtitle').innerText = res.canteenSubtitle;
            allMenuItems = res.menuItems || [];
            renderCategories();
            renderMenuItems();
          } else {
            alert(res.message);
          }
        })
        .catch(err => console.error("Lỗi tải thực đơn:", err));
    }

    // [Giữ nguyên các hàm render UI không chứa google.script.run]
    function renderCategories() {
      const cats = ['ALL'];
      allMenuItems.forEach(it => { if (it.category && !cats.includes(it.category)) cats.push(it.category); });
      const container = document.getElementById('categoryFilterContainer');
      container.innerHTML = cats.map(cat => `
        <button onclick="selectCategory('${cat}')" class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${currentCategory === cat ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400 hover:text-white'}">
          ${cat === 'ALL' ? 'Tất Cả' : cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) { currentCategory = cat; renderCategories(); renderMenuItems(); }
    function handleFilterMenu() { renderMenuItems(); }

    function renderMenuItems() {
      const q = document.getElementById('menuSearchInput').value.trim().toLowerCase();
      const filtered = allMenuItems.filter(it => {
        const matchCat = (currentCategory === 'ALL' || it.category === currentCategory);
        const matchQ = (!q || it.name.toLowerCase().includes(q) || it.category.toLowerCase().includes(q));
        return matchCat && matchQ;
      });
      const grid = document.getElementById('menuGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-xs">Không tìm thấy món phù hợp</div>`;
        return;
      }
      grid.innerHTML = filtered.map(it => `
        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-3 flex flex-col justify-between shadow-md space-y-2">
          <div class="h-28 bg-slate-900 rounded-xl overflow-hidden relative flex items-center justify-center">
            ${it.imageUrl ? `<img src="${it.imageUrl}" alt="${it.name}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-bowl-food text-3xl text-slate-700"></i>`}
            <span class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-sm text-slate-300 text-[10px] px-1.5 py-0.5 rounded-md font-semibold">${it.calories} kcal</span>
          </div>
          <div>
            <h4 class="font-extrabold text-white text-xs line-clamp-1">${it.name}</h4>
            <p class="text-[11px] text-amber-400 font-black mt-0.5">${Number(it.price).toLocaleString('vi-VN')} ₫</p>
          </div>
          <button onclick="addToCart('${it.id}')" class="w-full py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-sm">
            <i class="fa-solid fa-plus text-[10px]"></i> Thêm
          </button>
        </div>
      `).join('');
    }

    // 2. GIỎ HÀNG
    function addToCart(itemId) {
      const it = allMenuItems.find(x => x.id === itemId);
      if (!it) return;
      if (!cart[itemId]) cart[itemId] = { item: it, qty: 1 };
      else cart[itemId].qty += 1;
      updateCartBadge();
    }

    function updateCartBadge() {
      const totalCount = Object.values(cart).reduce((s, x) => s + x.qty, 0);
      const badge = document.getElementById('cartBadgeCount');
      if (totalCount > 0) { badge.innerText = totalCount; badge.classList.remove('hidden'); } 
      else badge.classList.add('hidden');
    }

    function openCartModal() {
      const list = document.getElementById('cartItemsList');
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Giỏ hàng của bạn đang trống</p>`;
        document.getElementById('cartTotalDisplay').innerText = "0 ₫";
      } else {
        let total = 0;
        list.innerHTML = keys.map(k => {
          const entry = cart[k];
          const subtotal = entry.item.price * entry.qty;
          total += subtotal;
          return `
            <div class="flex items-center justify-between py-2">
              <div class="flex-1 pr-2">
                <h5 class="text-xs font-bold text-white">${entry.item.name}</h5>
                <p class="text-[11px] text-amber-400 font-mono">${Number(entry.item.price).toLocaleString('vi-VN')} ₫</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="changeQty('${k}', -1)" class="w-6 h-6 rounded-lg bg-slate-700 text-white flex items-center justify-center text-xs font-bold">-</button>
                <span class="text-xs font-bold text-white w-4 text-center">${entry.qty}</span>
                <button onclick="changeQty('${k}', 1)" class="w-6 h-6 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center text-xs font-bold">+</button>
              </div>
            </div>
          `;
        }).join('');
        document.getElementById('cartTotalDisplay').innerText = Number(total).toLocaleString('vi-VN') + " ₫";
      }
      if (currentUser) {
        document.getElementById('orderCustName').value = currentUser.fullName || "";
        document.getElementById('orderCustPhone').value = currentUser.phone || "";
      }
      document.getElementById('cartModal').classList.remove('hidden');
    }

    function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

    function changeQty(itemId, delta) {
      if (!cart[itemId]) return;
      cart[itemId].qty += delta;
      if (cart[itemId].qty <= 0) delete cart[itemId];
      updateCartBadge();
      openCartModal();
    }

    // 3. ĐẶT MÓN API CALL
    function handlePlaceOrderSubmit() {
      const keys = Object.keys(cart);
      if (keys.length === 0) return alert("Giỏ hàng đang trống!");
      const custName = document.getElementById('orderCustName').value.trim();
      const custPhone = document.getElementById('orderCustPhone').value.trim();
      const pickupTime = document.getElementById('orderPickupTime').value;
      const paymentMethod = document.getElementById('orderPaymentMethod').value;
      const notes = document.getElementById('orderKitchenNotes').value.trim();

      if (!custName || !custPhone) return alert("Vui lòng nhập họ tên và số điện thoại nhận món!");
      const items = keys.map(k => ({ id: cart[k].item.id, name: cart[k].item.name, price: cart[k].item.price, qty: cart[k].qty }));
      const totalAmount = items.reduce((s, it) => s + (it.price * it.qty), 0);

      const btn = document.getElementById('btnSubmitPlaceOrder');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Đang gửi đơn đến bếp...`;

      const payload = {
        customerName: custName, customerPhone: custPhone,
        customerEmail: currentUser ? currentUser.email : "",
        pickupTime: pickupTime, paymentMethod: paymentMethod,
        notes: notes, items: items, totalAmount: totalAmount
      };

      callGAS('placeOrder', payload)
        .then(res => {
          btn.disabled = false;
          btn.innerHTML = `<span>Đặt Món Ngay</span>`;
          if (res.success) {
            if (!localSavedOrderIds.includes(res.orderId)) {
              localSavedOrderIds.unshift(res.orderId);
              localStorage.setItem('canteen_my_orders', JSON.stringify(localSavedOrderIds));
            }
            cart = {};
            updateCartBadge();
            document.getElementById('orderKitchenNotes').value = "";
            closeCartModal();
            alert(`🎉 ĐẶT MÓN THÀNH CÔNG!\nMã nhận món: ${res.shortId}\nTình trạng đơn sẽ tự động cập nhật mỗi 30 giây.`);
            switchTab('orders');
          } else {
            alert(res.message);
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerHTML = `<span>Đặt Món Ngay</span>`;
          alert("Lỗi kết nối: " + err.message);
        });
    }

    // 4. THEO DÕI ĐƠN HÀNG (ĐỒNG BỘ 30S)
    function loadCustomerOrders(isSearch, isSilent) {
      const container = document.getElementById('ordersListContainer');
      if (!isSilent && (!container.children.length || container.innerText.includes('Đang kiểm tra'))) {
        container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs"><i class="fa-solid fa-spinner fa-spin text-lg text-amber-500 mb-1"></i><p>Đang đồng bộ tình trạng đơn hàng...</p></div>`;
      }
      const searchCode = isSearch ? document.getElementById('searchOrderInput').value.trim() : "";
      const filter = { email: currentUser ? currentUser.email : "", phone: currentUser ? currentUser.phone : "", orderIds: localSavedOrderIds, searchCode: searchCode };

      callGAS('getCustomerOrders', filter)
        .then(res => {
          if (!res.success) {
            if (!isSilent) container.innerHTML = `<p class="text-xs text-red-400 text-center py-6">${res.message}</p>`;
            return;
          }
          const orders = res.orders || [];
          const hasReady = orders.some(o => o.orderStatus === 'Chờ lấy đồ');
          document.getElementById('navActiveOrderDot').classList.toggle('hidden', !hasReady);

          if (currentTab === 'orders') {
            if (orders.length === 0) {
              container.innerHTML = `<div class="text-center py-12 text-slate-500 space-y-2"><i class="fa-solid fa-receipt text-3xl text-slate-700"></i><p class="text-xs">Bạn chưa có đơn hàng nào.</p></div>`;
              return;
            }
            container.innerHTML = orders.map(o => {
              let statusBadge = '';
              let statusCardClass = 'border-slate-700 bg-slate-800';
              if (o.orderStatus === 'Đang chuẩn bị') statusBadge = `<span class="px-2.5 py-1 rounded-lg text-[11px] font-black bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center gap-1.5"><i class="fa-solid fa-fire text-[10px] animate-pulse"></i> Đang chuẩn bị món</span>`;
              else if (o.orderStatus === 'Chờ lấy đồ') { statusCardClass = 'border-emerald-500 bg-slate-800/90 shadow-lg shadow-emerald-500/10 animate-ready'; statusBadge = `<span class="px-2.5 py-1 rounded-lg text-[11px] font-black bg-emerald-500 text-slate-950 flex items-center gap-1.5"><i class="fa-solid fa-bell text-[10px]"></i> Đã nấu xong - Lấy ngay!</span>`; }
              else if (o.orderStatus.includes('hoàn thành')) statusBadge = `<span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-slate-700 text-slate-300">Đã nhận món</span>`;
              else statusBadge = `<span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-red-600/20 text-red-400">${o.orderStatus}</span>`;

              const itemsHtml = o.items.map(it => `
                <div class="flex justify-between items-center py-1 border-b border-slate-700/40 text-xs">
                  <span class="text-slate-200 font-semibold">${it.name} <b class="text-amber-400">x${it.qty}</b></span>
                  <span class="text-slate-400 font-mono">${Number(it.total).toLocaleString('vi-VN')} ₫</span>
                </div>
              `).join('');

              return `
                <div class="border-2 ${statusCardClass} rounded-2xl p-4 space-y-3 transition">
                  <div class="flex justify-between items-center border-b border-slate-700/60 pb-2.5">
                    <div><span class="text-2xl font-black text-amber-400">${o.shortId}</span><span class="text-[11px] text-slate-400 ml-1.5 font-semibold">(${o.createdAt})</span></div>
                    ${statusBadge}
                  </div>
                  <div class="space-y-1">${itemsHtml}</div>
                  ${o.notes ? `<div class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-300"><span class="font-bold text-[10px] uppercase text-amber-400 block"><i class="fa-solid fa-note-sticky"></i> Ghi chú cho bếp:</span><p class="italic text-slate-200 mt-0.5">${o.notes}</p></div>` : ''}
                  <div class="flex justify-between items-center pt-2 text-xs border-t border-slate-700/60">
                    <span class="text-slate-400 font-medium">Hình thức: <b>${o.paymentMethod}</b></span>
                    <span class="text-emerald-400 text-sm font-black">${Number(o.totalAmount).toLocaleString('vi-VN')} ₫</span>
                  </div>
                </div>
              `;
            }).join('');
          }
        })
        .catch(err => console.error("Lỗi đồng bộ:", err));
    }

    // 5. CHUYỂN TAB
    function switchTab(tab) {
      currentTab = tab;
      ['menu', 'orders', 'account'].forEach(t => {
        document.getElementById('tabView' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('hidden');
        document.getElementById('btnNav' + t.charAt(0).toUpperCase() + t.slice(1)).className = "py-1.5 rounded-xl flex flex-col items-center justify-center text-slate-400 font-bold text-[11px] hover:text-white transition";
      });
      document.getElementById('tabView' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
      document.getElementById('btnNav' + tab.charAt(0).toUpperCase() + tab.slice(1)).className = "py-1.5 rounded-xl flex flex-col items-center justify-center text-amber-400 font-bold text-[11px] transition";
      if (tab === 'orders') loadCustomerOrders(false, false);
    }

    // 6. TÀI KHOẢN & HẠN MỨC
    function renderUserProfileUI() {
      const loggedInBox = document.getElementById('accountLoggedInBox'), loggedOutBox = document.getElementById('accountLoggedOutBox');
      if (currentUser) {
        loggedInBox.classList.remove('hidden'); loggedOutBox.classList.add('hidden');
        document.getElementById('profileFullName').innerText = currentUser.fullName;
        document.getElementById('profileEmail').innerText = currentUser.email;
        document.getElementById('profilePhone').innerText = currentUser.phone;
        const limitBadge = document.getElementById('currentDailyLimitBadge');
        if (currentUser.dailyLimit && currentUser.dailyLimit > 0) {
          limitBadge.innerText = Number(currentUser.dailyLimit).toLocaleString('vi-VN') + " ₫/ngày";
          limitBadge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30";
          document.getElementById('inputNewDailyLimit').value = currentUser.dailyLimit;
        } else {
          limitBadge.innerText = "Không giới hạn";
          limitBadge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
          document.getElementById('inputNewDailyLimit').value = 0;
        }
      } else {
        loggedInBox.classList.add('hidden'); loggedOutBox.classList.remove('hidden'); showLoginView();
      }
    }

    function showLoginView() { document.getElementById('loginFormBox').classList.remove('hidden'); document.getElementById('registerFormBox').classList.add('hidden'); document.getElementById('forgotFormBox').classList.add('hidden'); }
    function showRegisterView() { document.getElementById('loginFormBox').classList.add('hidden'); document.getElementById('registerFormBox').classList.remove('hidden'); document.getElementById('forgotFormBox').classList.add('hidden'); }
    function showForgotView() { document.getElementById('loginFormBox').classList.add('hidden'); document.getElementById('registerFormBox').classList.add('hidden'); document.getElementById('forgotFormBox').classList.remove('hidden'); }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const acc = document.getElementById('loginAccount').value.trim(), pwd = document.getElementById('loginPassword').value.trim(), btn = document.getElementById('btnLoginSubmit');
      btn.disabled = true; btn.innerText = "Đang đăng nhập...";
      
      callGAS('loginClient', acc, pwd)
        .then(res => {
          btn.disabled = false; btn.innerText = "Đăng Nhập";
          if (res.success) {
            currentUser = res.user;
            localStorage.setItem('canteen_user_client', JSON.stringify(currentUser));
            renderUserProfileUI(); alert("Đăng nhập thành công!"); switchTab('menu');
          } else alert(res.message);
        })
        .catch(err => { btn.disabled = false; btn.innerText = "Đăng Nhập"; alert("Lỗi: " + err.message); });
    }

    function handleLogout() {
      if (confirm("Bạn có muốn đăng xuất tài khoản?")) { currentUser = null; localStorage.removeItem('canteen_user_client'); renderUserProfileUI(); }
    }

    function sendRegisterOTPAction() {
      const email = document.getElementById('regEmail').value.trim();
      if (!email || !email.includes('@')) return alert("Vui lòng nhập email hợp lệ!");
      const btn = document.getElementById('btnSendRegOTP'); btn.disabled = true; btn.innerText = "Đang gửi...";
      callGAS('sendOTP', email, "REGISTER").then(res => { btn.disabled = false; btn.innerText = "Gửi Lại OTP"; alert(res.message); });
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const regData = {
        fullName: document.getElementById('regFullName').value.trim(), phone: document.getElementById('regPhone').value.trim(),
        email: document.getElementById('regEmail').value.trim(), otp: document.getElementById('regOTP').value.trim(), password: document.getElementById('regPassword').value.trim()
      };
      const btn = document.getElementById('btnRegisterSubmit'); btn.disabled = true; btn.innerText = "Đang tạo...";
      callGAS('registerClient', regData).then(res => {
        btn.disabled = false; btn.innerText = "Xác Nhận Tạo Tài Khoản"; alert(res.message);
        if (res.success) showLoginView();
      });
    }

    function sendForgotOTPAction() {
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) return alert("Vui lòng nhập email!");
      const btn = document.getElementById('btnSendForgotOTP'); btn.disabled = true; btn.innerText = "Đang gửi...";
      callGAS('sendOTP', email, "FORGOT").then(res => { btn.disabled = false; btn.innerText = "Gửi Lại OTP"; alert(res.message); });
    }

    function handleForgotSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim(), otp = document.getElementById('forgotOTP').value.trim(), newPass = document.getElementById('forgotNewPassword').value.trim();
      callGAS('resetPasswordWithOTP', email, otp, newPass).then(res => { alert(res.message); if (res.success) showLoginView(); });
    }

    function handleSaveDailyLimit() {
      if (!currentUser) return;
      const limit = document.getElementById('inputNewDailyLimit').value.trim(), btn = document.getElementById('btnSaveDailyLimit');
      btn.disabled = true; btn.innerText = "Đang lưu...";
      callGAS('updateDailyLimit', currentUser.email, limit).then(res => {
        btn.disabled = false; btn.innerText = "Lưu Hạn Mức"; alert(res.message);
        if (res.success) { currentUser.dailyLimit = res.dailyLimit; localStorage.setItem('canteen_user_client', JSON.stringify(currentUser)); renderUserProfileUI(); }
      });
    }

    function handleChangePassword(e) {
      e.preventDefault();
      if (!currentUser) return;
      const oldPass = document.getElementById('changeOldPass').value.trim(), newPass = document.getElementById('changeNewPass').value.trim(), btn = document.getElementById('btnChangePassSubmit');
      btn.disabled = true; btn.innerText = "Đang đổi...";
      callGAS('changePassword', currentUser.email, oldPass, newPass).then(res => {
        btn.disabled = false; btn.innerText = "Lưu Mật Khẩu Mới"; alert(res.message);
        if (res.success) { document.getElementById('changeOldPass').value = ""; document.getElementById('changeNewPass').value = ""; }
      });
    }
  </script>
